    <clipPath id="tree-right-bottom"><rect x="220" y="250" width="200" height="188" /></clipPath>
    <clipPath id="letter-v-left"><rect x="500" y="170" width="50" height="220" /></clipPath>
    <clipPath id="letter-v-right"><rect x="550" y="170" width="50" height="220" /></clipPath>
  </defs>


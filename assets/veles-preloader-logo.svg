<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1691 438" role="img" aria-labelledby="title desc">
  <title id="title">Велес Групп</title>
  <desc id="desc">Анимированный логотип Велес Групп</desc>
  <style>
    .veles-loader-piece {
      fill: transparent;
      stroke: var(--ink);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      paint-order: stroke fill;
      animation:
        veles-loader-draw 1s ease-in var(--stroke-delay) both,
        veles-loader-fill 0.7s cubic-bezier(0.47, 0, 0.745, 0.715) var(--fill-delay) both;
    }

    @keyframes veles-loader-draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes veles-loader-fill {
      to { fill: var(--ink); }
    }

    @media (prefers-reduced-motion: reduce) {
      .veles-loader-piece {
        fill: var(--ink);
        stroke-dashoffset: 0;
        animation: none;
      }
    }
  </style>
  <defs>
    <clipPath id="roof-left"><rect x="0" y="0" width="226" height="438" /></clipPath>
